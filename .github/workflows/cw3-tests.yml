name: CW3 Tests

on:
  pull_request:
    paths:
      - "CW3/**"
      - ".github/workflows/cw3-tests.yml"
  push:
    branches:
      - main
    paths:
      - "CW3/**"
      - ".github/workflows/cw3-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run CW3 tests
        run: mvn -q -f CW3/pom.xml test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw3-surefire-reports
          path: CW3/target/surefire-reports
          if-no-files-found: warn

  package:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build CW3 main submission zip
        run: mvn -q -f CW3/pom.xml -Pse-implementation-zip package

      - name: Upload CW3 main submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW3SEImplementationGroup22
          path: CW3/target/CW3SEImplementationGroup22.zip
          if-no-files-found: error
